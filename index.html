'use strict';const data=JSON.parse(document.getElementById('dataset').textContent);let audience='producer';const reviewed=new Set();const $=id=>document.getElementById(id);function el(tag,text,parent){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}function list(parent,items){const ul=el('ul','',parent);items.forEach(x=>el('li',x,ul))}function chosen(){return data.fiches.find(f=>f.client_id===$('client').value)}
function render(){const f=chosen(),s=$('sheet');s.replaceChildren();$('print').disabled=$('export').disabled=!f;if(!f){el('p','Sin coincidencias.',s);return}const r=f[audience];el('small','DEMO FICTICIA · '+(audience==='producer'?'VISTA DEL PRODUCTOR':'BORRADOR PARA EL CLIENTE'),s);$('internal').setAttribute('aria-pressed',audience==='producer');$('customer').setAttribute('aria-pressed',audience==='customer');el('h1',f.name,s);el('p','Análisis al '+data.as_of+' · '+f.client_id,s);el('p','Escenario ficticio al '+data.as_of+'. No conectado a Neo. No acredita cobertura ni estado real de pagos.',s).className='warn';
if(audience==='producer'){el('h2','Prioridades y próximas acciones',s);r.opportunities.forEach(o=>{const card=el('div','',s);card.className='action';el('small',o.priority+' prioridad · Oportunidad a validar',card);el('h3',o.action,card);el('p','Por qué: '+o.reason,card);el('small','Evidencia simulada: '+o.evidence,card)});const done=el('button',reviewed.has(f.client_id)?'Revisión marcada · deshacer':'Marcar revisión realizada (simulación)',s);done.onclick=()=>{reviewed.has(f.client_id)?reviewed.delete(f.client_id):reviewed.add(f.client_id);render()};el('small',' Solo en esta sesión. No modifica pólizas ni contacta clientes.',s);el('h2','Cobranzas: solo Efectivo',s);if(!r.client_matches_portfolio)el('p','Identidad de deuda no conciliada con cartera: no unir por nombre.',s).className='warn';list(s,Object.entries(r.collections_cash_only).map(([cur,b])=>cur+': vencido '+b.overdue+' · vence hoy '+b.due_today+' · a vencer '+b.future+' · total '+b.total));el('h2','Conversación inicial',s);el('p',r.speech,s);}
el('h2','Hallazgos documentados',s);const c=f.customer;if(!c.verified_strengths.length&&!c.points_to_review.length)el('p','Todavía no se incorporaron hallazgos revisados de pólizas. El Excel no permite evaluar suficiencia ni exclusiones.',s).className='warn';for(const [title,items]of [['Fortalezas verificadas',c.verified_strengths],['Puntos a revisar',c.points_to_review]]){if(items.length){el('h3',title,s);list(s,items.map(x=>x.text+' [Fuente: '+x.source_id+' · '+x.locator+']'))}}
el('h2','Vencimientos próximos observados',s);list(s,c.upcoming_expiries.map(x=>'Referencia '+x.reference_id+' · certificado '+x.certificate_id+' · '+x.end));el('h2','Preguntas para validar',s);list(s,c.conversation_questions);el('p',c.scope,s);if(audience==='producer'){el('h2','Inventario del reporte, no cobertura certificada',s);const t=el('table','',s),head=el('tr','',t);['Ramo','Referencia','Certificado','Inicio','Fin','Fila origen'].forEach(v=>el('th',v,head));f.contracts.forEach(r=>{const tr=el('tr','',t);[r.branch,r.reference_id,r.certificate_id,r.start,r.end,r.source_row].forEach(v=>el('td',v,tr))})}el('p','No enviado al cliente. Revisión profesional requerida antes de compartir.',s);}
function options(){const q=$('search').value.toLowerCase(),old=$('client').value;$('client').replaceChildren();data.fiches.filter(f=>(f.name+' '+f.client_id).toLowerCase().includes(q)).forEach(f=>{const o=el('option',f.name+' · '+f.client_id,$('client'));o.value=f.client_id});if([...$('client').options].some(o=>o.value===old))$('client').value=old;render()}
el('h1','Tu próxima conversación, preparada', $('overview'));el('p','Dos escenarios para probar cómo Capa transforma una revisión en una acción comercial. Elegí un cliente y alterná las dos fichas.',$('overview'));el('h2','Cartera de demostración', $('overview'));el('p',data.summary.portfolio_detail_rows+' filas · '+data.summary.source_client_ids+' IDs de origen · '+data.summary.normalized_portfolio_clients+' identidades normalizadas de cartera',$('overview'));el('p',data.summary.unmatched_debt_clients+' identidades de deuda sin coincidencia exacta con cartera. No se juntan por nombre.',$('overview'));el('h2','Alcance y fuentes',$('limits'));list($('limits'),data.limitations);list($('limits'),data.sources.map(s=>s.kind+' · '+s.as_of+' · '+s.date_basis+' · Referencia ficticia '+s.source_id+(s.filter_header?' · Filtros: '+s.filter_header:'')));$('search').oninput=options;$('client').onchange=render;$('internal').onclick=()=>{audience='producer';render()};$('customer').onclick=()=>{audience='customer';render()};$('print').onclick=()=>window.print();$('export').onclick=()=>{const f=chosen();if(!f)return;const selected={demo:true,as_of:data.as_of,client_id:f.client_id,name:f.name,...f[audience]};const url=URL.createObjectURL(new Blob([JSON.stringify(selected,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='capa_demo_'+f.client_id+'_'+audience+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};options();
